<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Покер планирование</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { overscroll-behavior-y: none; }
    body {
      font-family: Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
      color: #e8eaf6;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; }
    .card, .table-scene, .mid, .votearea, .pot { min-width: 0; max-width: 100%; }
    .header {
      background: rgba(0, 0, 0, .35);
      border-bottom: 1px solid rgba(255, 255, 255, .12);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
    .room-info { font-size: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .room-code {
      background: rgba(255, 255, 255, .15); padding: 4px 10px; border-radius: 6px;
      font-weight: 700; letter-spacing: 1px;
    }
    .btn {
      border: 0; border-radius: 8px; cursor: pointer; font-size: 14px;
      padding: 9px 16px; background: #f9ab00; color: #202124; font-weight: 600;
      transition: transform .1s, box-shadow .2s;
    }
    .btn:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, .3); transform: translateY(-1px); }
    .btn.ghost { background: rgba(255, 255, 255, .12); color: #e8eaf6; border: 1px solid rgba(255,255,255,.25); }
    .btn.ghost:hover { background: rgba(255, 255, 255, .2); }
    .btn.small { padding: 6px 12px; font-size: 13px; }
    .container { max-width: 860px; margin: 0 auto; padding: 20px; }
    .card {
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 14px; padding: 16px; margin-bottom: 14px;
    }
    .landing { max-width: 380px; margin: 60px auto; }
    .landing h2 { font-size: 24px; margin-bottom: 18px; text-align: center; }
    label { display: block; font-size: 13px; color: #b0bec5; margin: 14px 0 5px; }
    input, select {
      width: 100%; padding: 10px; font-size: 15px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .25); background: rgba(0, 0, 0, .3);
      color: #e8eaf6;
    }
    input::placeholder { color: #78909c; }
    .row { display: flex; gap: 8px; margin-top: 18px; }
    .row .btn { flex: 1; }
    .join-row { display: flex; gap: 8px; margin-top: 10px; }
    .join-row input { flex: 1; }
    .hint { font-size: 13px; color: #90a4ae; margin-top: 12px; }
    .participants { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      background: rgba(255, 255, 255, .12); border: 1px solid rgba(255,255,255,.15);
      border-radius: 20px; padding: 5px 14px; font-size: 13px;
    }
    .chip.host { background: rgba(249, 171, 0, .25); border-color: #f9ab00; color: #ffd54f; }
    .chip.me {
      background: rgba(100, 181, 246, .28); border-color: #64b5f6; color: #bbdefb;
      box-shadow: 0 0 0 1px rgba(100, 181, 246, .4);
    }
    .round-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .round-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 13px; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    .badge.idle { background: rgba(255,255,255,.12); color: #b0bec5; }
    .badge.voting { background: rgba(249,171,0,.25); color: #ffd54f; }
    .badge.done { background: rgba(102,187,106,.25); color: #a5d6a7; }

    /* ---------- таймер ---------- */
    .timer-row {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      flex-wrap: wrap; margin-bottom: 14px;
      background: rgba(0, 0, 0, .25); border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 12px; padding: 10px 14px;
    }
    .timer-row.compact { width: fit-content; margin: 0 auto 14px; }
    .timer-display {
      display: flex; align-items: center; gap: 8px;
      font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: #ffd54f; letter-spacing: 1px;
    }
    .timer-ico { width: 24px; height: 24px; flex-shrink: 0; }
    .timer-display.ended { color: #ef5350; }
    .timer-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .timer-controls .btn { padding: 6px 12px; font-size: 13px; }

    /* ---------- стол ---------- */
    .table-scene { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .mid { display: flex; align-items: center; justify-content: center; gap: 14px; overflow-x: hidden; overflow-x: clip; }
    .row-seats { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; align-items: flex-end; }
    .col-seats { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
    .table {
      position: relative;
      width: min(480px, 100%);
      height: 380px;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 32%, rgba(255, 255, 255, .09), transparent 55%),
        radial-gradient(ellipse at center, #2e7d32 0%, #2a6e2e 55%, #1b5e20 100%);
      border: 20px solid #4e342e;
      box-shadow:
        inset 0 0 0 5px #3e2723,
        inset 0 0 55px rgba(0, 0, 0, .5),
        0 16px 36px rgba(0, 0, 0, .45);
      display: flex; align-items: center; justify-content: center;
    }
    .table::before {
      content: ''; position: absolute; inset: -24px; border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, .45); pointer-events: none;
    }
    .pot {
      position: relative; width: 86%; height: 76%;
      border-radius: 26px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .30), rgba(0, 0, 0, .14) 70%, transparent);
      border: 1px dashed rgba(255, 255, 255, .16);
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      gap: 8px; padding: 12px;
    }
    .pot .pempty { font-size: 12px; color: rgba(200, 230, 201, .55); text-align: center; }

    /* ---------- карты (общее) ---------- */
    .card-inner, .card-face, .card-back {
      position: absolute; inset: 0; border-radius: 8px;
      backface-visibility: hidden;
    }
    .card-face {
      background: linear-gradient(160deg, #ffffff, #f5f5f5);
      border: 1px solid #d5d5d5; box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
      transform: rotateY(180deg);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700; color: #17324d;
    }
    .card-face .coffee { font-size: 20px; line-height: 1; }
    .card-face .corner { position: absolute; font-size: 8px; color: #c62828; }
    .card-face .corner.tl { top: 3px; left: 4px; }
    .card-face .corner.br { bottom: 3px; right: 4px; transform: rotate(180deg); }
    .card-face .vmark { color: #2e7d32; font-size: 21px; font-weight: 700; }
    .card-back {
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 4px, transparent 4px 8px),
        linear-gradient(140deg, #1a237e, #283593 55%, #3949ab);
      border: 2px solid #c5cae9; box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
      display: flex; align-items: center; justify-content: center;
    }
    .card-back::after { content: 'SAGM'; color: #c5cae9; font-weight: 700; letter-spacing: 1px; font-size: 10px; }
    @keyframes flipShow { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }

    /* карта в руке (у игрока) */
    .scard { width: 46px; height: 66px; perspective: 600px; position: relative; }
    .scard .card-inner { transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.2,.2,1); }
    .scard.empty {
      border: 2px dashed rgba(255, 255, 255, .22); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.3); font-size: 16px;
    }
    .seat { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; }
    .seat.vert .scard { transform: rotate(90deg); }
    .sname {
      font-size: 12px; color: #c8e6c9; max-width: 76px; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .seat.me .sname {
      color: #bbdefb; font-weight: 700;
      background: rgba(100, 181, 246, .25); border: 1px solid #64b5f6;
      border-radius: 12px; padding: 1px 8px; max-width: 84px;
    }

    /* карта на столе */
    .potcard { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .potcard.place { animation: place .5s cubic-bezier(.3, .9, .4, 1) both; }
    @keyframes place {
      0% { transform: translateY(-90px) scale(1.5) rotate(12deg); opacity: 0; }
      60% { transform: translateY(6px) scale(.96); opacity: 1; }
      100% { transform: translateY(0) scale(1); }
    }
    .potcard .tcard { width: 46px; height: 66px; perspective: 600px; position: relative; }
    .potcard .card-inner { transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.2,.2,1); }
    .potcard.flipped .card-inner { transform: rotateY(180deg); }
    .potcard.anim .card-inner { animation: flipShow .55s cubic-bezier(.4,.2,.2,1) forwards; }
    .pname { font-size: 10px; color: #c8e6c9; max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }

    /* ---------- набор карт ---------- */
    .votearea { text-align: center; }
    .cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .pcard {
      width: 58px; height: 84px; border-radius: 10px; border: 2px solid rgba(255,255,255,.25);
      background: linear-gradient(160deg, #ffffff, #f5f5f5);
      box-shadow: 0 3px 8px rgba(0, 0, 0, .35);
      cursor: pointer; padding: 0; position: relative; display: flex;
      align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: #17324d;
      transition: transform .15s, box-shadow .2s, border-color .2s;
    }
    .pcard:hover { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0, 0, 0, .45); }
    .pcard .coffee { font-size: 26px; line-height: 1; }
    .pcard .corner { position: absolute; font-size: 10px; color: #17324d; }
    .pcard .corner.tl { top: 4px; left: 5px; }
    .pcard .corner.br { bottom: 4px; right: 5px; transform: rotate(180deg); }
    .pcard.picked {
      border-color: #e53935;
      box-shadow: 0 0 0 3px rgba(229, 57, 53, .35), 0 6px 14px rgba(0, 0, 0, .45);
    }
    .pcard.picked .corner, .pcard.picked .val { color: #c62828; }
    .summary { margin-top: 16px; font-size: 15px; color: #a5d6a7; }
    .summary b { font-size: 18px; }
    .msg { margin-top: 10px; font-size: 13px; }
    .msg.err { color: #ef5350; }
    .hidden { display: none !important; }

    /* ---------- телефон ---------- */
    @media (max-width: 720px) {
      .container { padding: 10px; }
      .header { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); }
      .mid { flex-direction: column; gap: 8px; }
      .col-seats { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .seat.vert .scard { transform: none; }
      .table { width: 100%; height: 350px; border-width: 14px; }
      .table::before { display: none; }
      .row-seats { gap: 10px; }
      .col-seats { gap: 10px; }
      .seat { width: 54px; }
      .scard { width: 38px; height: 56px; }
      .scard .card-face { font-size: 14px; }
      .potcard .tcard { width: 38px; height: 56px; }
      .potcard .card-face { font-size: 14px; }
      .potcard .card-face .coffee { font-size: 16px; }
      .potcard .card-face .corner { font-size: 7px; }
      .pot { gap: 6px; padding: 8px; }
      .pcard { width: 50px; height: 74px; font-size: 19px; }
      .pcard .coffee { font-size: 22px; }
      .pcard .corner { font-size: 8px; }
      .cards { gap: 7px; }
      .sname, .pname { font-size: 10px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Покер планирование</h1>
    <div class="room-info hidden" id="roomInfo">
      <span class="room-code" id="roomCode"></span>
      <button class="btn small ghost" id="copyBtn">Скопировать ссылку</button>
      <button class="btn small ghost" id="leaveBtn">Покинуть комнату</button>
    </div>
  </div>

  <div class="container">
    <div id="landing" class="card landing">
      <h2>Покер планирование</h2>
      <label for="nameInput">Ваше имя</label>
      <input id="nameInput" type="text" placeholder="Например, Иван">
      <label for="roleInput">Ваша роль</label>
      <select id="roleInput">
        <option value="participant" selected>Участник — голосует картами</option>
        <option value="host">Ведущий — управляет голосованием</option>
      </select>
      <div class="row">
        <button class="btn" id="createBtn">Создать комнату</button>
      </div>
      <label for="joinInput">Или введите код комнаты</label>
      <div class="join-row">
        <input id="joinInput" type="text" placeholder="ABC123" maxlength="6">
        <button class="btn ghost" id="joinBtn">Войти</button>
      </div>
      <div id="landingMsg" class="msg err hidden"></div>
    </div>

    <div id="room" class="hidden">
      <div class="card">
        <div class="round-head">
          <span class="badge idle" id="roundBadge">Ожидает</span>
          <div class="actions" id="hostActions"></div>
        </div>

        <div class="timer-row" id="timerRow">
          <div class="timer-display" id="timerDisplay">
            <svg class="timer-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="13" r="8"/>
              <path d="M12 9v4l2.5 2.5"/>
              <path d="M9 2h6"/>
            </svg>
            <span id="timerTime"></span>
          </div>
          <div class="timer-controls" id="timerControls"></div>
        </div>

        <div class="table-scene">
          <div class="row-seats" id="seatsTop"></div>
          <div class="mid">
            <div class="col-seats" id="seatsLeft"></div>
            <div class="table">
              <div class="pot" id="pot"></div>
            </div>
            <div class="col-seats" id="seatsRight"></div>
          </div>
          <div class="row-seats" id="seatsBottom"></div>
        </div>

        <div class="votearea" id="voteArea"></div>
      </div>

      <div class="card">
        <label>Участники (<span id="pCount">0</span>)</label>
        <div class="participants" id="participants"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, update, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { FIREBASE_CONFIG } from "./firebase-config.js";

    const CARDS = ['?', '0.5', '1', '2', '3', '5', '8', '13', '☕'];

    const app = initializeApp(FIREBASE_CONFIG);
    const db = getDatabase(app);

    let uid = localStorage.getItem('pp_uid');
    if (!uid) { uid = crypto.randomUUID(); localStorage.setItem('pp_uid', uid); }

    let roomId = null;
    let myName = '';
    let myRole = 'participant';
    let roomData = {};
    let flipped = {};
    let placed = {};
    let lastTimerStart = 0;
    let lastTimerEnded = false;
    let audioCtx = null;

    /* ---------- утилиты ---------- */

    const esc = s => String(s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const makeCode = n => {
      const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = '';
      for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)];
      return s;
    };

    const roomRef = () => ref(db, 'rooms/' + roomId);

    function showError(id, text) {
      const el = document.getElementById(id);
      if (!text) { el.classList.add('hidden'); return; }
      el.textContent = text;
      el.classList.remove('hidden');
    }

    const cardFace = (v, hearts) =>
      '<span class="corner tl">' + (hearts ? '♥' : '♠') + '</span>' +
      '<span class="corner br">' + (hearts ? '♥' : '♠') + '</span>' +
      (v === '☕' ? '<span class="coffee">☕</span>' : '<span class="val">' + esc(v) + '</span>');

    /* ---------- вход ---------- */

    function requireName() {
      myName = document.getElementById('nameInput').value.trim();
      if (!myName) { showError('landingMsg', 'Введите ваше имя.'); return false; }
      return true;
    }

    async function createRoom() {
      if (!requireName()) return;
      roomId = makeCode(6);
      await set(roomRef(), { createdAt: Date.now() });
      await joinRoom();
    }

    async function joinByCode() {
      if (!requireName()) return;
      const code = document.getElementById('joinInput').value.trim().toUpperCase();
      if (!code) { showError('landingMsg', 'Введите код комнаты.'); return; }
      roomId = code;
      const snap = await get(roomRef()).catch(() => null);
      if (!snap || !snap.exists()) {
        roomId = null;
        showError('landingMsg', 'Комната с таким кодом не найдена.');
        return;
      }
      await joinRoom();
    }

    function isLegacyVotes(votes) {
      if (!votes || typeof votes !== 'object') return true;
      return Object.values(votes).some(v => v && typeof v === 'object' && typeof v.value === 'undefined');
    }

    async function joinRoom() {
      showError('landingMsg', '');
      const chosenRole = document.getElementById('roleInput').value;

      const snap = await get(roomRef()).catch(() => null);
      const room = snap && snap.exists() ? snap.val() : {};
      const existing = room.participants && typeof room.participants === 'object'
        ? room.participants : {};
      const hasHost = Object.values(existing).some(p => p && p.role === 'host');

      let role = chosenRole;
      if (!hasHost && (chosenRole === 'host' || Object.keys(existing).length === 0)) {
        role = 'host';
      }
      myRole = role;

      const cleanup = { v: 2 };
      if (room.tasks) cleanup.tasks = null;
      if (isLegacyVotes(room.votes)) cleanup.votes = null;
      if (room.result && !(room.result.votes && Array.isArray(room.result.votes))) cleanup.result = null;
      if (!room.status) cleanup.status = 'idle';
      await update(roomRef(), cleanup);

      await set(ref(db, 'rooms/' + roomId + '/participants/' + uid),
        { name: myName, role: role, joinedAt: Date.now() });
      history.replaceState(null, '', '#' + roomId);
      document.getElementById('landing').classList.add('hidden');
      document.getElementById('room').classList.remove('hidden');
      document.getElementById('roomInfo').classList.remove('hidden');
      document.getElementById('roomCode').textContent = roomId;
      onValue(roomRef(), snap => {
        roomData = snap.val() || {};
        lastTimerStart = (roomData.timer && roomData.timer.startAt) || 0;
        try { render(); } catch (e) { console.error('render error:', e); }
      });
      window.addEventListener('beforeunload', leaveRoomSilent);
    }

    function leaveRoomSilent() {
      if (roomId && uid) {
        set(ref(db, 'rooms/' + roomId + '/participants/' + uid), null);
      }
    }

    function leaveRoom() {
      leaveRoomSilent();
      roomId = null;
      roomData = {};
      history.replaceState(null, '', location.pathname);
      document.getElementById('landing').classList.remove('hidden');
      document.getElementById('room').classList.add('hidden');
      location.reload();
    }

    function copyLink() {
      navigator.clipboard.writeText(location.href);
    }

    /* ---------- рендер ---------- */

    function render() {
      renderParticipants();
      renderRoundHead();
      renderTimer();
      renderTable();
      renderVoteArea();
      positionTimerRow();
    }

    function positionTimerRow() {
      const row = document.getElementById('timerRow');
      if (!row) return;
      const target = isHost()
        ? document.querySelector('.table-scene')
        : document.getElementById('voteArea');
      if (!target) return;
      const ok = isHost()
        ? row.nextElementSibling === target
        : row.previousElementSibling === target;
      if (!ok) { if (isHost()) target.before(row); else target.after(row); }
      row.classList.toggle('compact', !isHost());
    }

    /* ---------- таймер ---------- */

    const fmtTime = secs => {
      secs = Math.max(0, Math.ceil(secs));
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    };

    function chime(notes, step, vol) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t0 = audioCtx.currentTime;
        notes.forEach((f, i) => {
          const tt = t0 + i * step;
          [1, 1.006].forEach((mult, k) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = f * mult;
            gain.gain.setValueAtTime(0.0001, tt);
            gain.gain.exponentialRampToValueAtTime(vol * (k ? 0.35 : 1), tt + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, tt + 1.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(tt);
            osc.stop(tt + 1.3);
          });
        });
      } catch (e) { console.error('audio error:', e); }
    }

    const CHIME_START = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6 — вверх
    const CHIME_END = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1046.5, 1318.5, 1567.98]; // фанфары

    function unlockAudio() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }
    document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
    document.addEventListener('click', unlockAudio, { once: true });

    function renderTimer() {
      const t = roomData.timer;
      const controls = document.getElementById('timerControls');
      const row = document.getElementById('timerRow');
      const hasTimer = !!(t && t.endAt);
      controls.innerHTML = '';
      if (!isHost() && !hasTimer && row) row.classList.add('hidden');
      else if (row) row.classList.remove('hidden');
      if (isHost()) {
        if (hasTimer) {
          const b = document.createElement('button');
          b.className = 'btn small';
          b.textContent = 'Стоп';
          b.onclick = stopTimer;
          controls.appendChild(b);
        } else {
          [60, 120, 180, 300, 600].forEach(secs => {
            const b = document.createElement('button');
            b.className = 'btn small ghost';
            b.textContent = (secs / 60) + ' мин';
            b.onclick = () => setTimer(secs);
            controls.appendChild(b);
          });
        }
      }
      tick();
    }

    function setTimer(secs) {
      if (!isHost()) return;
      const now = Date.now();
      update(roomRef(), { timer: { duration: secs, startAt: now, endAt: now + secs * 1000 } });
    }

    function stopTimer() {
      if (!isHost()) return;
      update(roomRef(), { timer: null });
    }

    function tick() {
      const t = roomData.timer || null;
      const el = document.getElementById('timerDisplay');
      const timeEl = document.getElementById('timerTime');
      if (!el || !timeEl) return;
      const startAt = t && t.startAt ? t.startAt : 0;
      const active = !!(t && t.endAt);
      el.classList.toggle('hidden', !active);
      if (startAt !== lastTimerStart) {
        lastTimerStart = startAt;
        lastTimerEnded = false;
        if (startAt) chime(CHIME_START, 0.12, 0.22);
      }
      el.classList.remove('ended');
      let text = '—:—';
      if (t && t.endAt) {
        const remain = t.endAt - Date.now();
        if (remain > 0) {
          text = fmtTime(remain / 1000);
        } else {
          text = '0:00';
          el.classList.add('ended');
          if (!lastTimerEnded) {
            lastTimerEnded = true;
            chime(CHIME_END, 0.16, 0.26);
            const endedAt = t.endAt;
            setTimeout(function autoStop() {
              const cur = roomData.timer;
              if (cur && cur.endAt === endedAt && isHost()) {
                update(roomRef(), { timer: null });
              }
            }, 1600);
          }
        }
      }
      timeEl.textContent = text;
    }
    setInterval(tick, 250);

    function renderParticipants() {
      const parts = roomData.participants || {};
      const list = Object.values(parts).filter(p => p && p.name);
      document.getElementById('pCount').textContent = list.length;
      document.getElementById('participants').innerHTML = list.length
        ? list.map(p => '<span class="chip' + (p.role === 'host' ? ' host' : '') +
            (p.uid === uid ? ' me' : '') + '">' + esc(p.name) +
            (p.role === 'host' ? ' · Ведущий' : '') + (p.uid === uid ? ' · вы' : '') + '</span>').join('')
        : '<span class="hint">Пока никого нет</span>';
    }

    function isHost() {
      const me = roomData.participants && roomData.participants[uid];
      return !!me && me.role === 'host';
    }

    function participantCount() {
      return Object.values(roomData.participants || {})
        .filter(p => p && p.name && p.role !== 'host').length;
    }

    function validVotes() {
      const votes = roomData.votes || {};
      return Object.entries(votes)
        .filter(([, v]) => v && typeof v.value !== 'undefined')
        .map(([k, v]) => ({ uid: k, name: v.name, value: v.value }));
    }

    function myVote() {
      const v = roomData.votes && roomData.votes[uid];
      return v && typeof v.value !== 'undefined' ? v.value : null;
    }

    function renderRoundHead() {
      const status = roomData.status || 'idle';
      const badge = document.getElementById('roundBadge');
      badge.textContent = { idle: 'Ожидает', voting: 'Голосование', done: 'Раскрыто' }[status] || status;
      badge.className = 'badge ' + status;

      const actions = document.getElementById('hostActions');
      let html = '';
      if (isHost()) {
        if (status !== 'voting') html += '<button class="btn small" data-act="start">Начать раунд</button>';
        if (status === 'voting') html += '<button class="btn small" data-act="reveal">Вскрыть карты</button>';
        if (status !== 'idle') html += '<button class="btn small ghost" data-act="reset">Сбросить</button>';
      }
      actions.innerHTML = html;
      actions.querySelectorAll('[data-act]').forEach(b => {
        b.onclick = () => {
          const act = b.dataset.act;
          if (act === 'start') startRound();
          if (act === 'reveal') revealRound();
          if (act === 'reset') resetRound();
        };
      });
    }

    /* ---------- рассадка за столом ---------- */

    function renderTable() {
      const status = roomData.status || 'idle';
      const votes = roomData.votes || {};
      const res = roomData.result;
      const reveal = status === 'done';

      if (status === 'idle') { flipped = {}; placed = {}; }

      // за столом только участники, ведущий наблюдает
      const parts = Object.entries(roomData.participants || {})
        .map(([k, p]) => p && p.name ? { uid: k, name: p.name, role: p.role } : null)
        .filter(Boolean)
        .filter(p => p.role !== 'host')
        .sort((a, b) => (a.uid === uid ? -1 : 0) - (b.uid === uid ? -1 : 0));

      // вы сидите снизу, далее по кругу
      const maxRow = 5, maxCol = 3;
      const bottom = parts.slice(0, maxRow);
      const rest = parts.slice(maxRow);
      const top = rest.slice(0, maxRow);
      const sides = rest.slice(maxRow);
      const left = [], right = [];
      sides.forEach((p, i) => (i % 2 === 0 ? left : right).push(p));

      renderSeats('seatsBottom', bottom, false, votes, reveal);
      renderSeats('seatsTop', top, false, votes, reveal);
      renderSeats('seatsLeft', left, true, votes, reveal);
      renderSeats('seatsRight', right, true, votes, reveal);
      renderPot(parts, status, votes, res, reveal);
    }

    function renderSeats(id, list, vertical, votes, reveal) {
      document.getElementById(id).innerHTML = list.map(p => seatHtml(p, votes, reveal, vertical)).join('');
    }

    function seatHtml(p, votes, reveal, vertical) {
      const v = votes[p.uid];
      const hasVoted = !!v && typeof v.value !== 'undefined';
      const inHand = !hasVoted;
      const card = inHand
        ? '<div class="scard"><span class="card-inner">' +
          '<span class="card-face">' + cardFace('?', true) + '</span>' +
          '<span class="card-back"></span></span></div>'
        : '<div class="scard empty"></div>';
      return '<div class="seat' + (vertical ? ' vert' : '') + (p.uid === uid ? ' me' : '') + '">' +
        card +
        '<div class="sname">' + esc(p.name) + (p.uid === uid ? ' · вы' : '') + '</div></div>';
    }

    function renderPot(parts, status, votes, res, reveal) {
      const pot = document.getElementById('pot');
      const votedParts = parts.filter(p => {
        const v = votes[p.uid];
        return !!v && typeof v.value !== 'undefined';
      });

      if (!votedParts.length) {
        pot.innerHTML = status === 'done' ? '<div class="pempty">Никто не голосовал</div>' : '';
        return;
      }

      pot.innerHTML = votedParts.map((p, i) => {
        const v = votes[p.uid];
        const shouldFlip = reveal || p.uid === uid;
        const animate = shouldFlip && !flipped[p.uid];
        flipped[p.uid] = shouldFlip;
        const place = !placed[p.uid];
        placed[p.uid] = true;

        let face;
        if (reveal) {
          const r = res && res.votes ? res.votes.find(x => x.uid === p.uid) : null;
          face = cardFace(r ? r.value : '?', true);
        } else {
          face = p.uid === uid
            ? cardFace(v.value, true)
            : '<span class="vmark">✓</span>';
        }
        const delay = reveal && animate ? ' style="animation-delay:' + (i * 120) + 'ms"' : '';
        return '<div class="potcard' + (place ? ' place' : '') + (shouldFlip ? ' flipped' : '') + (animate ? ' anim' : '') + '">' +
          '<div class="tcard"><span class="card-inner"' + delay + '>' +
          '<span class="card-face">' + face + '</span>' +
          '<span class="card-back"></span>' +
          '</span></div>' +
          '<div class="pname">' + esc(p.name) + '</div></div>';
      }).join('');
    }

    function renderVoteArea() {
      const status = roomData.status || 'idle';
      const area = document.getElementById('voteArea');
      const votedCount = validVotes().length;
      const pCount = participantCount();

      if (status === 'idle') {
        area.innerHTML = '<div class="hint">' + (isHost()
          ? 'Нажмите «Начать раунд» — участники получат карты.'
          : 'Раунд ещё не начался. Дождитесь ведущего.') + '</div>';
        return;
      }

      if (status === 'voting') {
        if (isHost()) {
          area.innerHTML = '<div class="hint">Проголосовали: <b>' + votedCount + '</b> из ' + pCount +
            '. Карты ложатся на стол.</div>';
          return;
        }

        const mine = myVote();
        const cards = CARDS.map(v => {
          const picked = v === mine;
          return '<button class="pcard' + (picked ? ' picked' : '') + '" data-card="' + esc(v) + '">' +
            cardFace(v, picked) + '</button>';
        }).join('');
        area.innerHTML = '<div class="cards">' + cards + '</div>' +
          '<div class="hint">' + (mine
            ? 'Ваша карта на столе: <b>' + esc(mine) + '</b>' + (mine === '☕' ? ' (пропуск)' : '') + '.'
            : 'Выберите карту — она ляжет на стол.') + '</div>' +
          (mine ? '<div style="margin-top:10px"><button class="btn small ghost" id="cancelVoteBtn">Отменить выбор</button></div>' : '') +
          '<div class="hint">Проголосовали: <b>' + votedCount + '</b> из ' + pCount + '</div>';
        area.querySelectorAll('.pcard').forEach(b => {
          b.onclick = () => {
            if (b.dataset.card === mine) cancelVote();
            else castVote(b.dataset.card);
          };
        });
        const cancelBtn = document.getElementById('cancelVoteBtn');
        if (cancelBtn) cancelBtn.onclick = cancelVote;
        return;
      }

      const res = roomData.result;
      const skips = res && res.votes ? res.votes.filter(x => String(x.value) === '☕') : [];
      let html = '<div class="summary">Итог: <b>' + esc(res && res.summary || '—') + '</b></div>';
      if (skips.length) {
        html += '<div class="hint">Пропустили: ' + skips.map(x => esc(x.name)).join(', ') + ' ☕</div>';
      }
      area.innerHTML = html;
    }

    /* ---------- операции ---------- */

    function startRound() {
      if (!isHost()) return;
      update(roomRef(), { status: 'voting', votes: null, result: null });
    }

    function castVote(value) {
      if (isHost()) return;
      set(ref(db, 'rooms/' + roomId + '/votes/' + uid), { name: myName, value: value });
    }

    function cancelVote() {
      if (isHost()) return;
      remove(ref(db, 'rooms/' + roomId + '/votes/' + uid));
    }

    function revealRound() {
      if (!isHost() || (roomData.status || 'idle') !== 'voting') return;
      const rows = validVotes();
      const summary = computeSummary(rows.map(r => r.value));
      update(roomRef(), {
        status: 'done',
        result: { summary: summary, votes: rows }
      });
    }

    function resetRound() {
      if (!isHost()) return;
      update(roomRef(), { status: 'idle', votes: null, result: null });
    }

    function computeSummary(values) {
      const skips = values.filter(v => String(v) === '☕');
      const nums = values.map(v => {
        const s = String(v);
        if (s === '☕') return null;
        if (s === '?') return Infinity;
        const n = parseFloat(s.replace(',', '.'));
        return isNaN(n) ? null : n;
      }).filter(v => v !== null);
      let main;
      if (!nums.length) {
        main = '—';
      } else if (nums.every(v => v === nums[0])) {
        main = fmt(nums[0]) + ' (консенсус)';
      } else {
        nums.sort((a, b) => a - b);
        const mid = Math.floor(nums.length / 2);
        const median = nums.length % 2 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
        main = fmt(median) + ' (медиана)';
      }
      if (skips.length) main += ', пропуск: ' + skips.length;
      return main;
    }

    const fmt = n => Number.isFinite(n) ? String(n) : '∞';

    /* ---------- вход по ссылке ---------- */

    function initFromHash() {
      const code = (location.hash || '').replace('#', '').trim().toUpperCase();
      if (code) {
        document.getElementById('joinInput').value = code;
        document.getElementById('nameInput').focus();
      }
    }

    /* ---------- привязка кнопок ---------- */

    document.getElementById('createBtn').onclick = createRoom;
    document.getElementById('joinBtn').onclick = joinByCode;
    document.getElementById('copyBtn').onclick = copyLink;
    document.getElementById('leaveBtn').onclick = leaveRoom;

    initFromHash();
  </script>
</body>
